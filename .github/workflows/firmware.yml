# SPDX-License-Identifier: GPL-3.0-only
# Xebec - build the firmware on GitHub's Linux runners and check it in fm1-emu.
#
# 1. Fetch JieLi's toolchain from JieLi's own server and build the app image.
# 2. Build fm1-emu (joakimeriksson/fm1-emu, MIT) at a pinned commit, run the
#    image in it and check the screen it draws.
# 3. Check that the flash driver's RAM code never reaches into flash, and
#    run the flash driver and loader staging test image in fm1-emu.
# 4. Power the firmware on in fm1-emu with the update keys held, with one of
#    them, and over a leftover staging, and check what reaches the flash.
# 5. Check the update package against M-VAVE's stock package, byte for byte,
#    and boot it in fm1-emu as the FM-1's boot loader would.
# 6. On dev: publish the installer on GitHub Pages under dev/ (tools/make_site.py).
# The run's artifact "xebec-build" holds the app image, the disassembly,
# the link map and the screen capture.
name: Firmware

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  FM1_EMU_COMMIT: 3e3fb27df91239fe0e7c5bbf82b14c20ad7dd62a
  # M-VAVE's open SDK, for the stock package the update package is checked against
  FM1_OPEN_COMMIT: 4c7496daac04a95ff10d1afdcc8f9ead2dbabc41

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: JieLi toolchain (clang for pi32v2)
        run: |
          sh tools/get_toolchain.sh "$HOME/.jieli"
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/current" >> "$GITHUB_ENV"

      - name: Build Xebec
        run: sh tools/build.sh

      - name: Size
        run: |
          ls -l build/xebec_app.bin
          "$JIELI_TOOLCHAIN/common/bin/objdump" -h build/xebec.elf || true

      - name: fm1-emu (pinned)
        uses: actions/cache@v6
        id: emu-cache
        with:
          path: emu/target/release/fm1-emu
          key: fm1-emu-${{ env.FM1_EMU_COMMIT }}

      - name: Build fm1-emu
        if: steps.emu-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/joakimeriksson/fm1-emu emu
          git -C emu checkout "$FM1_EMU_COMMIT"
          cargo build --release -p fm1-emu --manifest-path emu/Cargo.toml

      - name: Flash driver RAM code stays in RAM
        run: |
          python3 tools/check_ram_code.py emu/target/release/fm1-emu build/xebec.elf build/xebec_xip.bin
          python3 tools/check_ram_code.py emu/target/release/fm1-emu build/test/xebec_flashtest.elf build/test/xebec_flashtest_xip.bin

      - name: Flash driver and loader staging test in fm1-emu
        run: python3 tools/check_flash_test.py emu/target/release/fm1-emu build/test

      - name: Run in fm1-emu and check the boot screen
        run: |
          mkdir -p work
          emu/target/release/fm1-emu --bin build/xebec_xip.bin --entry 0x02000120 \
              --ms 2000 --snap 1900 --steps 2000000000 --quiet | tail -n 20
          python3 tools/check_boot_screen.py work/lcd_1900.bmp "$(git rev-parse --short=7 HEAD | tr 'a-f' 'A-F')" 240

      - name: Update path in fm1-emu (update keys, one key, leftover staging)
        run: python3 tools/check_update_path.py emu/target/release/fm1-emu build/xebec_xip.bin build/xebec.elf work

      - name: Update package against M-VAVE's stock package
        run: |
          mkdir -p work
          curl -fsSL -o work/FM-1_015.fwsc \
              "https://raw.githubusercontent.com/m-vave/fm1_open/$FM1_OPEN_COMMIT/sdk/firmware/FM-1_015.fwsc"
          python3 tools/check_package.py build/xebec.fwsc build/xebec_app.bin build/xebec.elf --stock work/FM-1_015.fwsc

      - name: Boot the update package in fm1-emu and check the boot screen
        run: |
          emu/target/release/fm1-emu --fwsc build/xebec.fwsc --ms 2000 --snap 1900 --steps 2000000000 --quiet | tail -n 20
          mv work/lcd_1900.bmp work/package_lcd_1900.bmp
          python3 tools/check_boot_screen.py work/package_lcd_1900.bmp "$(git rev-parse --short=7 HEAD | tr 'a-f' 'A-F')" 240

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xebec-build
          path: |
            build/xebec.fwsc
            build/xebec_app.bin
            build/xebec_xip.bin
            build/xebec.dis
            build/xebec.map
            build/test/xebec_flashtest.dis
            build/test/xebec_flashtest.map
            work/*.bmp

      - name: The site (dev's installer under dev/)
        if: github.ref == 'refs/heads/dev'
        run: python3 tools/make_site.py build/xebec.fwsc "$(git rev-parse --short=7 HEAD | tr 'a-f' 'A-F')" _site

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/dev'
        with:
          path: _site

  pages:
    if: github.ref == 'refs/heads/dev'
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
